<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>now-playing</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
</head>
<body>
    <div class="screen">
        <button class="demo" id="demo" aria-label="Demo Mode">
            <img src="music.svg" alt="Music Icon" class="music-icon" />
            <span id="demo-tooltip" class="demo-tooltip">demo</span>
        </button>
        <div id="track-back" class="track track-back">Connectingg to da thing</div>
        <div id="artist-text" class="artist-text hidden"></div>
        <div class="record-wrapper" id="record-wrapper">
            <div id="sleeve" class="sleeve"></div>
            <div class="record" id="record">
                <div class="label" id="label"></div>
            </div>
        </div>
        <div id="track-front" class="track track-front">Connectingg to da thing</div>
    </div>

    
    <script src="app.js"></script>
